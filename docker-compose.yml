services:
  ollama:
    image: ollama/ollama:latest
    container_name: kbai-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_ORIGINS=*
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: kbai-open-webui
    depends_on:
      - ollama
    ports:
      - "127.0.0.1:3001:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    volumes:
      - open_webui_data:/app/backend/data
    restart: unless-stopped

  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: kbai-anythingllm
    ports:
      - "127.0.0.1:8081:3001"
    volumes:
      - anythingllm_data:/app/server/storage
      - obsidian_vault:/obsidian:ro
    environment:
      - STORAGE_DIR=/app/server/storage
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_PATH=http://kbai-ollama:11434
      - OLLAMA_MODEL_PREF=hf.co/NousResearch/Hermes-3-Llama-3.1-8B-GGUF:Q4_K_M
      - OLLAMA_MODEL_TOKEN_LIMIT=4096
      - EMBEDDING_ENGINE=ollama
      - EMBEDDING_BASE_PATH=http://kbai-ollama:11434
      - EMBEDDING_MODEL_PREF=nomic-embed-text
      - EMBEDDING_MODEL_MAX_CHUNK_LENGTH=8192
    cap_add:
      - SYS_ADMIN
    restart: unless-stopped

  telegram-bot:
    build: ./telegram-bot
    container_name: kbai-telegram-bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_CHAT_ID=${TELEGRAM_ALLOWED_CHAT_ID:-}
      - OLLAMA_BASE_URL=http://kbai-ollama:11434
      - OLLAMA_MODEL=hf.co/NousResearch/Hermes-3-Llama-3.1-8B-GGUF:Q4_K_M
      - SYSTEM_PROMPT=You are Hermes, a knowledgeable and direct AI assistant. Answer concisely. Use markdown formatting when helpful.
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
  open_webui_data:
  anythingllm_data:
  obsidian_vault:
